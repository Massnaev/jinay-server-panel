name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.22.x
          cache: false

      - name: Build and verify release archive
        env:
          SERVERPANEL_RELEASE_VERSION: ${{ github.ref_name }}
        run: scripts/build-release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/serverpanel-linux-amd64.tar.gz
          release/serverpanel-linux-amd64.tar.gz.sha256
          --verify-tag
          --generate-notes
          --title "Jinay ${GITHUB_REF_NAME}"
